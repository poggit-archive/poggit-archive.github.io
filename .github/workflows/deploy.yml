name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cache normalized plugin icons
        uses: actions/cache@v4
        with:
          path: .memory-icon-cache
          key: memory-icons-v1-${{ hashFiles('data/api/v1/current.json') }}
          restore-keys: |
            memory-icons-v1-
      - name: Install dependencies
        run: npm ci
      - name: Verify archive links and virion provenance
        run: node --test tests/*.test.mjs
      - name: Build Astro site
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
